<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golbert PRO</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">
<div id="login" class="bg-zinc-900 p-8 rounded-2xl w-96">
<h1 class="text-2xl font-bold mb-6">Golbert PRO Login</h1>
<input id="email" placeholder="admin@golbert.com" class="w-full bg-zinc-800 p-3 rounded mb-2">
<input id="pass" type="password" placeholder="admin123" class="w-full bg-zinc-800 p-3 rounded mb-4">
<button onclick="doLogin()" class="w-full bg-white text-black p-3 rounded font-bold">Entrar</button>
<p class="text-xs text-gray-500 mt-4">Demo: admin@golbert.com / admin123</p>
</div>
<div id="dash" class="hidden max-w-6xl w-full p-6">
<div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-bold">Golbert PRO</h1><button onclick="logout()" class="text-sm text-gray-400">Salir</button></div>
<div class="grid grid-cols-3 gap-3 mb-6" id="plans"></div>
<div class="bg-zinc-900 p-4 rounded-xl mb-6 flex gap-2"><select id="plan" class="bg-zinc-800 p-2 rounded"><option value="basic">Basic $5 - 1vCPU/1GB/20GB</option><option value="medium">Medium $10 - 2vCPU/2GB/40GB</option><option value="pro">Pro $20 - 4vCPU/4GB/80GB</option></select><button onclick="createVM()" class="bg-white text-black px-6 py-2 rounded font-bold">+ Crear VPS</button></div>
<div id="vms" class="grid gap-3"></div>
</div>
<script>
const API = location.origin.replace(':3000',':8443');
let TOKEN = localStorage.getItem('golbert_token');
if(TOKEN) showDash();
async function doLogin(){
  const res = await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});
  const data = await res.json(); if(!res.ok) return alert(data.detail);
  TOKEN = data.token; localStorage.setItem('golbert_token',TOKEN); showDash();
}
function showDash(){ login.classList.add('hidden'); dash.classList.remove('hidden'); loadPlans(); loadVMS(); }
function logout(){ localStorage.removeItem('golbert_token'); location.reload(); }
async function loadPlans(){
  const plans = await fetch(API+'/plans').then(r=>r.json());
  document.getElementById('plans').innerHTML = Object.entries(plans).map(([k,v])=>`<div class="bg-zinc-900 p-4 rounded-xl"><p class="font-bold">${k}</p><p class="text-sm text-gray-400">${v.vcpu} vCPU / ${v.ram}MB / ${v.disk}GB</p><p class="text-green-400 font-bold">$${v.price}/mes</p></div>`).join('');
}
async function loadVMS(){
  const vms = await fetch(API+'/vms',{headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.json());
  document.getElementById('vms').innerHTML = vms.map(v=>`<div class="bg-zinc-900 p-4 rounded-xl flex justify-between"><div><b>${v.name}</b><p class="text-sm text-gray-400">${v.vcpu} vCPU - ${v.ram}MB</p></div><div class="flex gap-2"><button onclick="act('${v.name}','start')" class="bg-green-600 px-3 py-1 rounded">ON</button><button onclick="act('${v.name}','stop')" class="bg-yellow-600 px-3 py-1 rounded">OFF</button><button onclick="act('${v.name}','delete')" class="bg-red-600 px-3 py-1 rounded">X</button></div></div>`).join('') || '<p class="text-gray-500">No tienes VPS, crea uno</p>';
}
async function createVM(){ await fetch(API+'/vms',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({plan:document.getElementById('plan').value})}); loadVMS(); }
async function act(n,a){ await fetch(`${API}/vms/${n}/${a}`,{method:'POST',headers:{Authorization:'Bearer '+TOKEN}}); setTimeout(loadVMS,1000); }
</script></body></html>
